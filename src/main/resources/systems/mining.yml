# Settings for the "mining" level system. See default.yml for what every setting does

enabled: true
# Players join this system with /sl addSystem
auto-add-players: false
max-level: 20
exp-multiplier: 1.0

levelup-message: '<green>You leveled up! New mining level: %level%</green>'
# No message above the hotbar when gaining mining exp
exp-gain-message: ''
# No booster broadcasts for mining. Remove these to use the messages in config.yml
booster-start-message: ''
booster-end-message: ''

exp-gain:
  on-chat: 0.0
  on-mobkill: 0.0
  on-playerkill: 0.0
  on-blockbreak: 0.1
  on-blockplace: 0.0

spawner-mobs:
  exp-multiplier: 1.0

# Overrides the rate-limiter in config.yml for this system only. Any setting left out uses config.yml's value,
# e.g. this example also limits mining the same block over and over in this system. Use enabled: false to turn it off here
# rate-limiter:
#   sources:
#     block-break: true

exp-requirements:
  # LINEAR: each level costs base-exp-req + level * (base-exp-req * exp-req-multiplier). In this configuration, that adds
  # 4 exp (0.5 * 8) every level: level 1 costs 8, level 2 costs 12, level 3 costs 16, etc.
  exp-scalar-type: LINEAR
  base-exp-req: 8.0
  exp-req-multiplier: 0.5

# See default.yml for everything the blocks section can use: tags, wildcards, and ItemsAdder or CraftEngine blocks
blocks:
  break:
    DIAMOND_ORE: 1.1
    DEEPSLATE_DIAMOND_ORE: 1.2
    DEEPSLATE_EMERALD_ORE: 15.0
  # Only blocks where silk touch is different from break
  break-silk-touch:
    GRASS_BLOCK: 0.01
    DIAMOND_ORE: 0.0
    DEEPSLATE_DIAMOND_ORE: 0.0
    DEEPSLATE_EMERALD_ORE: 0.0
  place:
    RAIL: 0.03
    POWERED_RAIL: 0.08

use-milestones: true
milestones:
  20:
    commands:
      - 'give %player% diamond_pickaxe 1'
    messages:
      - '<green>You''ve earned a Diamond Pickaxe for reaching mining level 20!</green>'
