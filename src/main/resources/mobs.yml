# In the spirit of Organization, comments have been kept to a minimum. Please go to the Wiki for in-depth guidance

default:
  ENDERMAN: 0.1
  MANNEQUIN: 0.7
  spawner:
    ZOMBIE: 0.05
# Customize how much exp each mob grants you per leveling system
# Mobs not listed use the default number listed in levelsystems.yml
# The spawner section sets the exp for mobs that came from a mob spawner. Spawner mobs not listed there
# use their normal exp times spawner-mobs.exp-multiplier in levelsystems.yml
