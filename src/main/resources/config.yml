# In the spirit of Organization, comments have been kept to a minimum. Please go to the Wiki for in-depth guidance

data-format: 'h2'
# Options: h2, sqlite, mysql (more coming eventually)

mysql:
  host: "127.0.0.1:3306"
  database: 'sldatabase'
  username: example
  password: elpmaxe


debug-mode: false
# Turn this on when you find a bug and try and cause the bug again.
# Then, report the bug on discord and/or github.
# You can report bugs without this, but the debug entries make my life easier.

check-for-updates: true
# Checks Modrinth on startup and logs a message if a newer release is available.

autosave-interval: 5m
# How often player data is saved to the database. Combine d, h, m and s, e.g. 1d5h4m2s, 30m or 45s.
# Player data is also saved when a player logs off and when the server stops.

config-version: 2.1
