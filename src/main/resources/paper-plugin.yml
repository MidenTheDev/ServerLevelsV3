name: ServerLevels
version: '${version}'

main: us.to.midensthings.serverLevels.ServerLevels
api-version: '26.1.2'
load: POSTWORLD

dependencies:
  server:
    NouveauEnchanting:
      required: false
      join-classpath: true
    ProjectKorra:
      required: false
      join-classpath: true
    MythicMobs:
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
permissions:
  serverlevels.commands.addsystem:
    default: op
    description: Allows usage of server levels addSystem command
  serverlevels.commands.removesystem:
    default: op
    description: Allows usage of server levels removeSystem command
  serverlevels.commands.set:
    default: op
    description: Allows usage of server levels set commands
  serverlevels.commands.add:
    default: op
    description: Allows usage of server levels add commands
  serverlevels.commands.remove:
    default: op
    description: Allows usage of server levels remove commands
  serverlevels.commands.reload:
    default: op
    description: Allows usage of server levels reload command
  serverlevels.commands.setMultiplier:
    default: op
    description: Allows usage of server levels setMultiplier
  serverlevels.commands.progress:
    default: true
    description: Allows players to view their own progress to the next level
  serverlevels.commands.progress.other:
    default: op
    description: Allows viewing other players' progress to the next level
  serverlevels.commands.editsystem:
    default: op
    description: Allows users to edit the details of existing LevelSystems using /ls
  serverlevels.commands.savesystem:
    default: op
    description: Allows users to save edited LevelSystems to levelsystems.yml using /ls save
  serverlevels.commands.create:
    default: op
    description: Allows users to create new LevelSystems using /ls create
  serverlevels.commands.booster:
    default: op
    description: Allows users to start or queue exp boosters for level systems using /sl booster
  serverlevels.commands.pause:
    default: op
    description: Allows users to pause and unpause players' exp gains in a level system using /sl pause and /sl unpause
