# In the spirit of Organization, comments have been kept to a minimum. Please go to the Wiki for in-depth guidance

default:
  enabled: true
  send-message-on-levelup: true
  levelup-message: '<green>You leveled up! New level: %level%</green>'
  # Messages use MiniMessage format for color and text effects
  max-level: 100
  exp-gain-multiplier: 0.0
  use-milestones: true
  show-exp-gain: true
  exp-gain-message: "<green>Gained </green><dark_green>%exp%</dark_green><green> exp</green>"
  auto-add-players: true
  broadcast-boosters: true
  # Broadcasts to everyone when an exp booster for this system starts or ends. Boosters are started with /sl booster
  booster-start-message: "<gold>A <yellow>%multiplier%x</yellow> exp booster for <yellow>%system%</yellow> has started! It lasts <yellow>%duration%</yellow>.</gold>"
  booster-end-message: "<gold>The <yellow>%multiplier%x</yellow> exp booster for <yellow>%system%</yellow> has ended.</gold>"
  # Booster messages can use %multiplier%, %system%, and %duration% (start message only)
  exp-gain:
    on-chat: 0.2
    on-mobkill: 0.4
    on-playerkill: 0.6
    on-blockbreak: 0.01
    on-blockplace: 0.01
  spawner-mobs:
    exp-multiplier: 1.0
    # Multiplies exp from killing or bending mobs that came from a mob spawner, e.g. 0.25 for a quarter of the normal exp.
    # Set exact exp for specific spawner mobs in mobs.yml. Trial spawners are not affected
  exp-requirements:
    base-exp-req: 8.0
    exp-req-multiplier: 1.1
    # formula: previous-exp-cost * exp-req-multiplier
    # in default configuration, exp cost increases by 10% every level. Level 2 costs 8 exp (base), level 3 costs 8.8, 4 costs 9.68, etc.
    # leveling up is easier early on, and gets harder slower, but gets much more difficult in later levels than linear
    exp-scalar-type: 'EXPONENTIAL'


mining:
  enabled: true
  send-message-on-levelup: true
  levelup-message: '<green>You leveled up! New mining level: %level%</green>'
  max-level: 20
  exp-gain-multiplier: 0.0
  use-milestones: true
  auto-add-players: false
  exp-gain:
    on-chat: 0.0
    on-mobkill: 0.0
    on-playerkill: 0.0
    on-blockbreak: 0.1
    on-blockplace: 0.0
  spawner-mobs:
    exp-multiplier: 1.0
  # rate-limiter:
  #   sources:
  #     block-break: true
  # Overrides the rate-limiter in config.yml for this system only. Any setting left out uses config.yml's value,
  # e.g. the example above also limits mining the same block over and over in this system. Use enabled: false to turn it off here
  exp-requirements:
    base-exp-req: 8.0
    exp-req-multiplier: 0.5
    # formula: player-level * (base-exp-req * exp-req-multiplier) + base-exp-req
    # in default configuraiton, adds 4 exp (0.5 * 8) every level. Level 2 costs 8, level 3 costs 12, 4 costs 16, etc.
    # leveling up is harder early on, and gets harder quicker, but never gets as hard as multiplier
    exp-scalar-type: 'LINEAR'